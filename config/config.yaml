# PaliGemma-TSN Configuration File
# Enhanced Remote Sensing Image Captioning with TSN Integration

# Model Configuration
model:
  model_id: "google/paligemma-3b-mix-224"  # Base PaliGemma model from HuggingFace
  feature_dim: 1024                        # Feature dimension for internal processing
  max_seq_length: 512                      # Maximum sequence length for text generation
  loss_type: "ForCausalLMLoss"            # Loss function for causal language modeling

# Dataset Configuration
data:
  train_csv: "processed_dataset/train.csv"  # Path to training data CSV file
  val_csv: "processed_dataset/val.csv"      # Path to validation data CSV file
  max_train_samples: -1                     # Max training samples (-1 = use all)
  max_val_samples: 100                      # Max validation samples (-1 = use all, set to 100 for testing)

# Training Hyperparameters
training:
  num_epochs: 3                    # Number of training epochs
  batch_size: 8                    # Batch size per GPU (adjust based on VRAM)
  learning_rate: 0.00008           # Learning rate for AdamW optimizer
  gradient_accumulation_steps: 1   # Steps to accumulate gradients (effective batch size = batch_size * this)
  weight_decay: 0.000001           # L2 regularization weight decay
  warmup_steps: 50                 # Number of warmup steps for learning rate scheduler
  mixed_precision: true            # Enable mixed precision training (bf16)
  label_smoothing: 0.0             # Label smoothing factor (0.0 = disabled)
  use_wandb: true                  # Enable Weights & Biases logging
  seed: 42                         # Random seed for reproducibility

# Quantization Configuration (QLoRA)
quantization:
  enable_quantization: true              # Enable 4-bit quantization for memory efficiency
  load_in_4bit: true                     # Load model weights in 4-bit precision
  bnb_4bit_compute_dtype: "bfloat16"     # Compute dtype for 4-bit operations
  bnb_4bit_quant_type: "nf4"             # Quantization type (nf4 = NormalFloat4)

# LoRA (Low-Rank Adaptation) Configuration
lora:
  r: 8                                   # LoRA rank (higher = more parameters, better performance)
  lora_alpha: 16                         # LoRA scaling parameter (typically 2*r)
  lora_dropout: 0.1                      # Dropout rate for LoRA layers
  target_modules: ["q_proj", "o_proj", "k_proj", "v_proj", "gate_proj", "up_proj", "down_proj"]  # Transformer modules to apply LoRA

# TSN (Temporal Segment Network) Configuration
tsn:
  integration_method: "vision_tower"     # TSN integration method: "vision_tower", "adapter", "enhanced", "direct"

  # Progressive Mixing Ratios (Training)
  initial_original_ratio: 0.95          # Initial weight for original PaliGemma features (start conservative)
  initial_tsn_ratio: 0.05               # Initial weight for TSN features (start small)
  final_original_ratio: 0.80            # Final weight for original features (reduce over time)
  final_tsn_ratio: 0.20                 # Final weight for TSN features (increase over time)

  # Generation Mixing Ratios (Inference)
  gen_original_ratio: 0.85              # Weight for original features during generation
  gen_tsn_ratio: 0.15                   # Weight for TSN features during generation

  # Progressive Training Schedule
  progressive_steps: 1000               # Number of steps for progressive mixing transition
  warmup_tsn_steps: 200                 # Steps to warm up TSN before progressive mixing

  # TSN Architecture
  backbone: "resnet50"                  # CNN backbone for TSN (resnet50, resnet101, etc.)
  pretrained: true                      # Use ImageNet pretrained weights
  segment_scales: [[1, 1], [2, 2], [4, 4]]  # Multi-scale spatial segmentation (1x1=global, 2x2=regions, 4x4=local)
  feature_dim: 2048                     # TSN feature dimension (ResNet50 output)

  # Advanced Features
  use_attention: true                   # Enable attention mechanism for feature fusion
  use_fpn: true                         # Use Feature Pyramid Network for multi-scale features
  projection_dim: 1152                  # Projection dimension to match PaliGemma vision features
  dropout_rate: 0.1                     # Dropout rate for regularization
  layer_norm_eps: 1e-6                  # Layer normalization epsilon
  adaptive_mixing: true                 # Enable adaptive mixing based on training progress
  spatial_awareness: true               # Enable spatial position encoding
  feature_enhancement: true             # Enable feature enhancement modules

# Output Configuration
output:
  output_dir: "paligemma_tsn_full_dataset"   # Directory to save trained model and checkpoints
  save_every_n_epochs: 1                     # Save model checkpoint every N epochs

# Prompt Engineering Configuration
prompt:
  input_prompt: "caption en"                 # Input prompt for image captioning task
  training_template: "caption en {caption}"  # Template for training with caption placeholder
  mask_prefix: ""                            # Prefix for masking (empty = no masking)

# Evaluation Configuration
evaluation:
  eval_during_training: true        # Enable evaluation during training (validation sampling)
  generate_max_length: 512          # Maximum length for generated captions
  num_beams: 1                      # Number of beams for beam search (1 = greedy decoding)
  min_length: 5                     # Minimum length for generated captions
  repetition_penalty: 1.2           # Penalty for repeated tokens (>1.0 = discourage repetition)
  no_repeat_ngram_size: 3           # Prevent repeating n-grams of this size
  max_new_tokens: 50                # Maximum number of new tokens to generate
  do_sample: false                  # Use deterministic generation (false = greedy/beam search)
  temperature: 1.0                  # Sampling temperature (only used if do_sample=true)
  top_p: 1.0                        # Nucleus sampling parameter (only used if do_sample=true)
  early_stopping: true              # Stop generation early when EOS token is generated

# Weights & Biases Configuration
wandb:
  project: "paligemma-tsn-full-dataset"                               # WandB project name
  run_name: "full-dataset-training"                                   # WandB training run name
  test_run_name: "full-dataset-test"                                  # WandB test run name
  tags: ["paligemma", "tsn", "qlora", "risc", "full-dataset"]         # Tags for organizing experiments
  log_model: true                                                     # Log model artifacts to WandB
  log_freq: 50                                                        # Log metrics every N steps
